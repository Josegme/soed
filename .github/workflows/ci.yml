name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  calidad:
    name: Lint, tipos, i18n, contraste y tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n:check
      - run: pnpm contraste
      - run: pnpm --filter @soed/web cliente
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Cobertura del dominio (mínimo 90 %)
        run: pnpm --filter @soed/domain test:coverage

  base-de-datos:
    name: Migraciones, RLS por rol, tipos e integración PostgREST
    runs-on: ubuntu-24.04
    env:
      POSTGREST_VERSION: v13.0.7
      POSTGREST_SHA256: 036738687f9814a9db5f3d78afa6e614bcf20c66add04455e34ea494784db7b3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL 16 + pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-pgtap libtap-parser-perl
      - run: pnpm db:test
      - name: Tipos generados al día con las migraciones
        run: |
          pnpm db:types
          git diff --exit-code packages/shared-types/src/database.types.ts
      - name: PostgREST (versión y checksum fijos)
        run: |
          curl -sSL -o /tmp/pgrst.tar.xz "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_VERSION}/postgrest-${POSTGREST_VERSION}-linux-static-x86-64.tar.xz"
          tar xJf /tmp/pgrst.tar.xz -C /tmp
          echo "${POSTGREST_SHA256}  /tmp/postgrest" | sha256sum -c -
          sudo install -m 755 /tmp/postgrest /usr/local/bin/postgrest
      - run: pnpm --filter @soed/web cliente
      - run: pnpm test:integracion

  build:
    name: Build ${{ matrix.cliente }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        cliente: [_template, encuentro-danzas]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @soed/web build
        env:
          SOED_CLIENT: ${{ matrix.cliente }}

  e2e:
    name: E2E y accesibilidad (sitio público)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @soed/web exec playwright install --with-deps chromium
      - run: pnpm --filter @soed/web build
        env:
          SOED_CLIENT: encuentro-danzas
      - run: pnpm test:e2e
        env:
          SOED_CLIENT: encuentro-danzas
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
